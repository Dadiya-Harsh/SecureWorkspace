name: Web App CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'specs/encryption-format/**'
      - '.github/workflows/web-app-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - 'specs/encryption-format/**'

jobs:
  validate-and-test:
    name: Lint, Typecheck & Crypto Vector Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Cryptographic Parity Tests
        run: npm test

      - name: Typecheck and Build Production Bundle
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7
