[project]
name = "secureworkspace"
version = "0.1.0"
description = "Client-side encrypted backup and sync tool"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "pynacl>=1.5.0",
    "requests>=2.31.0",
    "platformdirs>=4.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
desktop = [
    "pyside6>=6.6.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/secureworkspace_core"]

[tool.pytest.ini_options]
pythonpath = ["core"]
testpaths = ["tests"]
